# ---------------------------------------------------------------------------
# Method / port ACLs
# ---------------------------------------------------------------------------
acl SSL_ports  port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT    method CONNECT

# ---------------------------------------------------------------------------
# Anthropic control plane.
# From the published allowlist: code.claude.com/docs/en/network-config
# Note: a leading dot matches the domain AND its subdomains,
# so `.claude.com` covers claude.com, platform.claude.com, code.claude.com.
# ---------------------------------------------------------------------------
acl allowed_sites dstdomain api.anthropic.com
acl allowed_sites dstdomain mcp-proxy.anthropic.com
acl allowed_sites dstdomain .claude.com
acl allowed_sites dstdomain .claude.ai              # WAS MISSING: OAuth login + downloads.claude.ai
acl allowed_sites dstdomain storage.googleapis.com

# ---------------------------------------------------------------------------
# Dev tooling
# ---------------------------------------------------------------------------
acl allowed_sites dstdomain .github.com             # api., codeload., github.com
acl allowed_sites dstdomain .githubusercontent.com  # WAS MISSING: raw./objects./release-assets.
acl allowed_sites dstdomain registry.npmjs.org
# Uncomment what your stack actually needs — every line here is attack surface.
#acl allowed_sites dstdomain pypi.org files.pythonhosted.org
#acl allowed_sites dstdomain deb.debian.org security.debian.org
#acl allowed_sites dstdomain .docker.io production.cloudflare.docker.com   # image pulls from dind
#acl allowed_sites dstdomain ghcr.io pkg-containers.githubusercontent.com

# ---------------------------------------------------------------------------
# Project-specific
# ---------------------------------------------------------------------------
acl allowed_sites dstdomain .uz.gov.ua

# ---------------------------------------------------------------------------
# Dropped from your list: .sentry.io and .statsigapi.net.
# Current telemetry goes to http-intake.logs.us5.datadoghq.com and
# browser-intake-us5-datadoghq.com. Leave them blocked here rather than setting
# CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC — that env var also kills Remote
# Control, a proxy deny does not.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Access rules — order matters
# ---------------------------------------------------------------------------
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports    # WAS MISSING: your rule allowed CONNECT to
                                       # ANY port on an allowed domain, e.g. :22
http_access allow CONNECT allowed_sites
http_access allow allowed_sites
http_access deny all

# ---------------------------------------------------------------------------
# Audit log. Every TCP_DENIED line tells you exactly what the agent tried to
# reach: `docker compose logs -f proxy`
#
# Write to the normal FILE paths, not /dev/stdout. The ubuntu/squid entrypoint
# already runs `tail -F` on access.log, cache.log, error.log and store.log and
# forwards them to stdout. Squid drops privileges to the `proxy` user, which
# cannot reopen PID 1's stdout pipe (owned by root) — hence
# "FATAL: Cannot open '/dev/stdout' for writing".
# ---------------------------------------------------------------------------
logformat allowlist %tl %>a %Ss/%03>Hs %rm %ru
access_log stdio:/var/log/squid/access.log logformat=allowlist
cache_log  /var/log/squid/cache.log
cache deny all

# Emits "WARNING: HTTP requires the use of Via" at startup. Expected, harmless —
# drop this line if you'd rather not see it.
via off
forwarded_for delete
httpd_suppress_version_string on
shutdown_lifetime 5 seconds

# Containers usually have no IPv6 route. Without this, squid resolves AAAA
# first, tries it, fails, and returns 503 — which reads like an API outage.
dns_v4_first on

http_port 3128
